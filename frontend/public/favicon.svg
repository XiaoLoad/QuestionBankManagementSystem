<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6458e0"/>
      <stop offset="1" stop-color="#4c3cc4"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景（Notion 紫，呼应默认主题色 #5645d4） -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>

  <!-- 打开的书本 -->
  <g fill="#ffffff">
    <path d="M64 42 C54 34 40 32 30 35 L30 86 C40 83 54 85 64 92 Z" opacity="0.95"/>
    <path d="M64 42 C74 34 88 32 98 35 L98 86 C88 83 74 85 64 92 Z" opacity="0.8"/>
    <rect x="62" y="42" width="4" height="50" rx="2"/>
  </g>

  <!-- 对勾徽章：答对 / 判分 -->
  <circle cx="92" cy="90" r="20" fill="#22c55e" stroke="#ffffff" stroke-width="5"/>
  <path d="M83 90 l6 6 l13 -13" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
